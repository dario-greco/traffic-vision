# Runs scripts/evaluation.py only (no training). Triggered manually via workflow_dispatch.
#
# data_final/ (images + labels) is fetched via Git LFS on checkout.
# Model checkpoints under models/ must still be present in the repo (or LFS); see
# scripts/evaluation.py for exact paths.

name: Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # checkout's LFS integration sometimes leaves pointer files; force a full LFS pull.
      - name: Pull Git LFS files
        run: |
          git lfs version
          git lfs install
          git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies (project + D-FINE)
        working-directory: ${{ github.workspace }}
        run: |
          uv sync --frozen
          uv pip install -r models/D-FINE/requirements.txt

      - name: Run evaluation
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/evaluation.py
